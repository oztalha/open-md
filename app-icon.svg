<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- OpenMD: a page of markdown with an arrow out of its corner (open it, send it). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece7dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px tile, 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- the page -->
  <g filter="url(#shadow)">
    <rect x="262" y="250" width="420" height="540" rx="44" fill="url(#page)"/>
  </g>
  <!-- heading: a yellow "#" and a bold line -->
  <g fill="#e2a900">
    <rect x="318" y="322" width="14" height="62" rx="5" transform="skewX(-12) translate(70 0)"/>
    <rect x="344" y="322" width="14" height="62" rx="5" transform="skewX(-12) translate(70 0)"/>
    <rect x="308" y="337" width="62" height="12" rx="5"/>
    <rect x="304" y="358" width="62" height="12" rx="5"/>
  </g>
  <rect x="392" y="330" width="190" height="34" rx="17" fill="#2c2c31"/>
  <!-- body text lines -->
  <g fill="#8d8a84">
    <rect x="310" y="430" width="320" height="22" rx="11"/>
    <rect x="310" y="482" width="280" height="22" rx="11"/>
    <rect x="310" y="534" width="306" height="22" rx="11"/>
    <rect x="310" y="610" width="250" height="22" rx="11"/>
    <rect x="310" y="662" width="200" height="22" rx="11"/>
  </g>
  <!-- the arrow out of the top-right corner, with a gap ring so it reads on the page -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M612 420 L790 242 M676 236 H796 V356" stroke="#1d1d20" stroke-width="104"/>
    <path d="M612 420 L790 242 M676 236 H796 V356" stroke="#ffd23f" stroke-width="56"/>
  </g>
</svg>
